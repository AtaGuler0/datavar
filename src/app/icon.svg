<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!--
    The mark, at tab size: a 3×3 crowd of contributors where three have
    consented. Same set as components/logo.tsx — squares 1, 3 and 8 — so the
    tab and the header are recognisably the same thing.

    Squares are equal here rather than accented-slightly-larger as in the
    header: at 16px a one-pixel difference reads as a rendering fault.

    Colours follow the tab's own theme instead of the page's. On a dark tab
    strip the ink grey and slate blue both sink into the background, so they
    lift together — the mark stays a mark rather than a smudge.
  -->
  <style>
    .base { fill: #c3c7cf }
    .lit  { fill: #3d4a6b }
    @media (prefers-color-scheme: dark) {
      /* Inverted rather than lightened: on paper the crowd is pale and the
         consented squares are dark, so on a dark strip the crowd has to
         recede and the accent has to carry. Nudging both to mid-grey made
         them one flat block at 16px. */
      .base { fill: #646a7a }
      .lit  { fill: #aebbdd }
    }
  </style>

  <rect class="base" x="1"  y="1"  width="8" height="8"/>
  <rect class="lit"  x="12" y="1"  width="8" height="8"/>
  <rect class="base" x="23" y="1"  width="8" height="8"/>

  <rect class="lit"  x="1"  y="12" width="8" height="8"/>
  <rect class="base" x="12" y="12" width="8" height="8"/>
  <rect class="base" x="23" y="12" width="8" height="8"/>

  <rect class="base" x="1"  y="23" width="8" height="8"/>
  <rect class="base" x="12" y="23" width="8" height="8"/>
  <rect class="lit"  x="23" y="23" width="8" height="8"/>
</svg>
