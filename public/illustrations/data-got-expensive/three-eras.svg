<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-label="Three eras of what a record of personal data has been worth: byproduct, inventory, input.">
  <style>
    .bg { fill: #fbfaf9; }
    .eyebrow { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.16em; text-transform: uppercase; fill: #8b91a1; }
    .h { font: 500 22px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: -0.02em; fill: #16192b; }
    .p { font: 400 14px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #565d70; }
    .val { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #3d4a6b; }
    .rule { stroke: rgba(22,25,43,0.1); stroke-width: 1; }
    .step { stroke: #3d4a6b; stroke-width: 2; fill: none; stroke-linecap: square; }
    .dot { fill: #3d4a6b; }
  </style>

  <rect class="bg" width="960" height="320" />

  <line class="rule" x1="333" y1="40" x2="333" y2="212" />
  <line class="rule" x1="626" y1="40" x2="626" y2="212" />

  <g>
    <text class="eyebrow" x="40" y="58">Until about 2020</text>
    <text class="h" x="40" y="94">Byproduct</text>
    <text class="p" x="40" y="130">Logged because storage got cheap.</text>
    <text class="p" x="40" y="152">Sold by pointing advertisements at it.</text>
    <text class="p" x="40" y="174">Worth nothing on its own.</text>
  </g>

  <g>
    <text class="eyebrow" x="373" y="58">2023 to now</text>
    <text class="h" x="373" y="94">Inventory</text>
    <text class="p" x="373" y="130">Licensed in bulk, platform to lab.</text>
    <text class="p" x="373" y="152">Priced in tens of millions a year.</text>
    <text class="p" x="373" y="174">Still worth nothing to whoever wrote it.</text>
  </g>

  <g>
    <text class="eyebrow" x="666" y="58">Next</text>
    <text class="h" x="666" y="94">Input</text>
    <text class="p" x="666" y="130">Scarce, dated, and agreed to.</text>
    <text class="p" x="666" y="152">The unit worth pricing is one</text>
    <text class="p" x="666" y="174">person's contribution.</text>
  </g>

  <path class="step" d="M40 282 H293 V262 H586 V232 H920" />
  <circle class="dot" cx="166" cy="282" r="4" />
  <circle class="dot" cx="439" cy="262" r="4" />
  <circle class="dot" cx="753" cy="232" r="4" />

  <text class="val" x="40" y="304">no price</text>
  <text class="val" x="373" y="284">a price, paid to the platform</text>
  <text class="val" x="666" y="254">a price, payable to a person</text>
</svg>
