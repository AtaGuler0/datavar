<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Training dataset size per frontier run rises toward the finite stock of public human text, meeting it between 2026 and 2032.">
  <style>
    .bg { fill: #fbfaf9; }
    .axis { stroke: rgba(22,25,43,0.2); stroke-width: 1; }
    .grid { stroke: rgba(22,25,43,0.06); stroke-width: 1; }
    .tick { font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b91a1; }
    .axis-title { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.14em; fill: #8b91a1; }
    .label { font: 500 14px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #16192b; }
    .sub { font: 400 12px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #565d70; }
    .curve { stroke: #3d4a6b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .curve-proj { stroke: #3d4a6b; stroke-width: 2; fill: none; stroke-dasharray: 6 5; stroke-linecap: round; }
    .ceiling { stroke: #16192b; stroke-width: 1.5; fill: none; }
    .window { fill: rgba(61,74,107,0.07); }
    .window-edge { stroke: rgba(61,74,107,0.28); stroke-width: 1; stroke-dasharray: 3 4; }
  </style>

  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f5f3f1" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8b91a1" stroke-width="1.5" />
    </pattern>
  </defs>

  <rect class="bg" width="960" height="420" />

  <!-- projected crossing window: 2026 to 2032 -->
  <rect class="window" x="505" y="60" width="311" height="286" />
  <line class="window-edge" x1="505" y1="60" x2="505" y2="346" />
  <line class="window-edge" x1="816" y1="60" x2="816" y2="346" />
  <text class="tick" x="660" y="52" text-anchor="middle">2026 to 2032</text>
  <text class="tick" x="660" y="36" text-anchor="middle">projected crossing</text>

  <!-- ceiling: finite stock of public human text -->
  <rect x="90" y="112" width="830" height="16" fill="url(#hatch)" />
  <line class="ceiling" x1="90" y1="112" x2="920" y2="112" />
  <text class="label" x="90" y="78">The stock of public human text</text>
  <text class="sub" x="90" y="98">roughly 300 trillion tokens, and it does not grow much</text>

  <!-- demand curve -->
  <path class="curve" d="M90 332 C 190 322, 250 306, 300 286 S 400 236, 460 196 L 505 168" />
  <path class="curve-proj" d="M505 168 C 560 146, 600 132, 650 124 S 760 116, 816 114 L 920 112" />
  <circle cx="505" cy="168" r="4.5" fill="#3d4a6b" />
  <text class="label" x="430" y="162" text-anchor="end">Tokens per frontier training run</text>
  <text class="sub" x="430" y="182" text-anchor="end">solid to today, dashed where it is a projection</text>

  <!-- axes -->
  <line class="axis" x1="90" y1="346" x2="920" y2="346" />
  <g class="tick" text-anchor="middle">
    <text x="90" y="368">2018</text>
    <text x="298" y="368">2022</text>
    <text x="505" y="368">2026</text>
    <text x="713" y="368">2030</text>
    <text x="920" y="368">2034</text>
  </g>
  <text class="axis-title" x="90" y="398">TOKENS, LOG SCALE · SCHEMATIC, AFTER EPOCH AI</text>
</svg>
